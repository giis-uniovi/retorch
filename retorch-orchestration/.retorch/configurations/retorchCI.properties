# Configuration properties for the Continuous Integration (CI) environment and System Under Test (SUT). Specifies the
# Jenkins CI Agent, the base path of the test cases and some configurations of the SUT like the port or the frontend
# url.
agentCIName=any
testsBasePath=somepath/somedir/
sut-location=$WORKSPACE
app-url="http://full-teaching-$TJOB_NAME:5000"
sut-wait-html=<div class=\\"esh-catalog-item col-md-4\\">
# Profiling (false by default, can be overridden with --profiling / --no-profiling): measures the resource usage of
# the TJobs and publishes the usage profile. The pipeline uses the jar $HOME/.retorch/retorch-profiling-cli.jar and, if it
# is not there, downloads it from profiling-jar-url (a project can prepare the jar in .retorch/customscriptscode/custom-usageprofile)
profiling=false
profiling-jar-url=https://github.com/giis-uniovi/retorch/releases/latest/download/retorch-profiling-cli.jar
# Cloud regions whose prices are compared: comma separated lists (e.g. westeurope,northeurope). They can be overridden
# in the pipeline with the AZURE_REGIONS / AWS_REGIONS environment variables. An empty list disables the provider.
azure-region=westeurope
aws-region=eu-west-1
# Optional extra price providers (id=regions pairs separated by ';'): price-providers=oracle=global;ibm=us-south,eu-de
